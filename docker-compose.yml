# ================================================================
# AcademiX - Docker Compose (VPS Ubuntu 4Go RAM)
# ================================================================
# Architecture:
#   - Laravel (PHP-FPM + Nginx) → Port 8000
#   - Node.js (Socket.io)       → Port 3001
#   - Python (FastAPI IA)        → Port 5000
#   - MySQL LTS                  → Port 3306
#   - MongoDB 8.0                → Port 27017
#   - Redis 7                    → Port 6379 (cache Laravel)
#
# Total mémoire réservée: ~1.3 Go | Limite: ~2.5 Go
# Laisse ~1.5 Go pour l'OS + Docker daemon + marges
# ================================================================
#
# ⚠ IMPORTANT - MySQL 8.4+ :
#   --default-authentication-plugin=mysql_native_password est SUPPRIMÉ
#   dans MySQL 8.4 (désactivé par défaut) et RETIRÉ dans MySQL 9.0.
#   PHP 8.4+ supporte nativement caching_sha2_password.
#   → Ce flag n'est PAS inclus. Ne pas le réactiver.
# ================================================================

services:
  # ----------------------------------------------------------
  # Laravel API - Backend principal
  # ----------------------------------------------------------
  laravel:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    container_name: academix-laravel
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-${DB_NAME:-academix}}
      - DB_USERNAME=${DB_USERNAME:-${DB_USER:-academix_user}}
      - DB_PASSWORD=${DB_PASSWORD:-academix_pass_2026}
      - DB_SSL=${DB_SSL:-false}
      - DATABASE_URL=${DATABASE_URL}
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SCHEME=${REDIS_SCHEME:-tcp}
      - NODE_BACKEND_URL=http://node:3001
      - PYTHON_AI_SERVICE_URL=http://python:5000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-webhook_secret_2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost/auth/google/callback}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:contact@academix.app}
    ports:
      - "${LARAVEL_PORT:-8000}:80"
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - academix-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M

  # ----------------------------------------------------------
  # Node.js - WebSocket + Messagerie temps réel
  # ----------------------------------------------------------
  node:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: academix-node
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_DATABASE:-${DB_NAME:-academix}}
      - DB_USER=${DB_USERNAME:-${DB_USER:-academix_user}}
      - DB_PASSWORD=${DB_PASSWORD:-academix_pass_2026}
      - DB_SSL=${DB_SSL:-false}
      - DATABASE_URL=${DATABASE_URL}
      - DB_URL=${DB_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3001}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-http://localhost}
      - OPENROUTER_APP_TITLE=AcademiX
      - KAVT_ENABLED=${KAVT_ENABLED:-true}
      - KAVT_MODEL=${KAVT_MODEL:-arcee-ai/trinity-large-preview:free}
    ports:
      - "${NODE_PORT:-3001}:3001"
    volumes:
      - node_uploads:/app/uploads
    networks:
      - academix-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # ----------------------------------------------------------
  # Python FastAPI - Service Intelligence Artificielle
  # ----------------------------------------------------------
  python:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: academix-python
    restart: unless-stopped
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_DATABASE:-${DB_NAME:-academix}}
      - DB_USER=${DB_USERNAME:-${DB_USER:-academix_user}}
      - DB_PASSWORD=${DB_PASSWORD:-academix_pass_2026}
      - DB_SSL=${DB_SSL:-false}
      - DATABASE_URL=${DATABASE_URL}
      - DB_URL=${DB_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL}}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-liquid/lfm-2.5-1.2b-thinking:free}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "${PYTHON_PORT:-5000}:5000"
    volumes:
      - python_uploads:/app/uploads
      - python_generated:/app/generated
    networks:
      - academix-net
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # ----------------------------------------------------------
  # Caddy - Reverse-proxy HTTPS (TLS automatique Let's Encrypt)
  # Point d'entrée sécurisé unique (443) devant laravel/node/python.
  # ----------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: academix-caddy
    restart: unless-stopped
    depends_on:
      - laravel
      - node
      - python
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - academix-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# ----------------------------------------------------------
# Réseau privé
# ----------------------------------------------------------
networks:
  academix-net:
    driver: bridge

# ----------------------------------------------------------
# Volumes persistants
# ----------------------------------------------------------
volumes:
  laravel_storage:
    driver: local
  node_uploads:
    driver: local
  python_uploads:
    driver: local
  python_generated:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
