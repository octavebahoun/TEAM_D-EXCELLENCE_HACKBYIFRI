# Racine monorepo - Railway doit déployer chaque service séparément :
#   - backend/laravel/  → Service Laravel (PHP)
#   - backend/node/     → Service Node.js (WebSocket)
#   - python/           → Service Python (IA)
#
# Ce fichier n'est PAS utilisé par Railway si chaque service a son propre
# nixpacks.toml dans son répertoire. Il sert de fallback inoffensif.

[phases.build]
cmds = ["echo 'Root monorepo - deploy individual services'"]

[start]
cmd = "echo 'Nothing to run at root level'"
