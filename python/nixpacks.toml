providers = ["python"]

[phases.setup]
nixPkgs = [
  "python311",
  "ffmpeg",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "glib",
  "libffi",
  "harfbuzz",
  "fontconfig"
]

[start]
# Railway fournit $PORT automatiquement. uvicorn doit écouter dessus.
cmd = "cd python && uvicorn main:app --host 0.0.0.0 --port $PORT"
